version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres_container
    environment:
      POSTGRES_DB: kubdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
    ports:
      - "5432:5432"
    networks:
      kubBackend:
        ipv4_address: 172.21.0.10

  django:
    build:
      context: .
      dockerfile: ./kubBackend/dockerfiles/dockerfile_for_rest/dockerfile
    container_name: django_container
    depends_on:
      - postgres
      - sentinel1
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_NAME=kubdb
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD="1"
    ports:
      - "8000:8000"
    networks:
      kubBackend:
          ipv4_address: 172.21.0.11
  
  django-websockets:
    build: 
      context: .
      dockerfile: ./kubBackend/dockerfiles/dockerfile_for_sockets/dockerfile
    container_name: django_container_sockets
    depends_on:
      - postgres
      - sentinel1
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_NAME=kubdb
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD="1"
    ports:
      - "8001:8001"
    networks:
      kubBackend:
        ipv4_address: 172.21.0.12

  frontend:
    build:
      context: ./my-app
      dockerfile: dockerfile.dev
    container_name: react_app
    ports:
      - "5173:5173"
    environment:
      - REACT_APP_API_URL=http://django:8000
    depends_on:
      - django
    networks:
      kubBackend:
        ipv4_address: 172.21.0.13
      
  redis-master:
    image: redis:7.2.4-alpine
    container_name: redis-master
    hostname: redis-master
    ports:
      - "6379:6379"
    volumes:
      - ./data/master:/data
    # --- FIX: More aggressive 'rm -f' to explicitly target any .rdb files and AOF files, including base RDB files. ---
    command: sh -c 'rm -f /data/*.rdb /data/appendonly.aof* && redis-server --port 6379'
    restart: always
    networks:
      kubBackend:
        ipv4_address: 172.21.0.3

  redis-slave-1:
    image: redis:7.2.4-alpine
    container_name: redis-slave-1
    hostname: redis-slave-1
    command: sh -c 'rm -f /data/*.rdb /data/appendonly.aof* && redis-server --slaveof redis-master 6379 --save "" --appendonly no'
    ports:
      - "6380:6379"
    # volumes:
    #   - ./data/slave:/data
    networks:
      kubBackend: 
        ipv4_address: 172.21.0.4
    depends_on: 
      - redis-master

  redis-slave-2:
    image: redis:7.2.4-alpine
    container_name: redis-slave-2
    hostname: redis-slave-2
    command: sh -c 'rm -f /data/*.rdb /data/appendonly.aof* && redis-server --slaveof redis-master 6379 --save "" --appendonly no'
    ports:
      - "6381:6379"
    # volumes:
    #   - ./data/slave:/data
    networks:
      kubBackend: 
        ipv4_address: 172.21.0.5
    depends_on: 
      - redis-master

  sentinel1:
    image: redis:7.2.4-alpine
    container_name: sentinel1
    hostname: sentinel1
    depends_on:
      - redis-master
    ports:
      - "26379:26379"
    command: >
      sh -c 'echo "bind 0.0.0.0" > /etc/sentinel.conf &&
             # FIX: Using internal service name 'redis-master' instead of ${HOST_IP}
             echo "sentinel monitor mymaster redis-master 6379 2" >> /etc/sentinel.conf &&
             echo "sentinel resolve-hostnames yes" >> /etc/sentinel.conf &&
             echo "sentinel down-after-milliseconds mymaster 10000" >> /etc/sentinel.conf &&
             echo "sentinel failover-timeout mymaster 10000" >> /etc/sentinel.conf &&
             echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
             redis-sentinel /etc/sentinel.conf'
    networks:
      kubBackend:
        ipv4_address: 172.21.0.6


  sentinel2:
    image: redis:7.2.4-alpine
    container_name: sentinel2
    hostname: sentinel2
    depends_on:
      - redis-master
    ports:
      - "26380:26379"
    command: >
      sh -c 'echo "bind 0.0.0.0" > /etc/sentinel.conf &&
             # FIX: Using internal service name 'redis-master' instead of ${HOST_IP}
             echo "sentinel monitor mymaster redis-master 6379 2" >> /etc/sentinel.conf &&
             echo "sentinel resolve-hostnames yes" >> /etc/sentinel.conf &&
             echo "sentinel down-after-milliseconds mymaster 10000" >> /etc/sentinel.conf &&
             echo "sentinel failover-timeout mymaster 10000" >> /etc/sentinel.conf &&
             echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
             redis-sentinel /etc/sentinel.conf'
    networks:
      kubBackend:
        ipv4_address: 172.21.0.7

  sentinel3:
    image: redis:7.2.4-alpine
    container_name: sentinel3
    hostname: sentinel3
    depends_on:
      - redis-master
    ports:
      - "26381:26379"
    command: >
      sh -c 'echo "bind 0.0.0.0" > /etc/sentinel.conf &&
             # FIX: Using internal service name 'redis-master' instead of ${HOST_IP}
             echo "sentinel monitor mymaster redis-master 6379 2" >> /etc/sentinel.conf &&
             echo "sentinel resolve-hostnames yes" >> /etc/sentinel.conf &&
             echo "sentinel down-after-milliseconds mymaster 10000" >> /etc/sentinel.conf &&
             echo "sentinel failover-timeout mymaster 10000" >> /etc/sentinel.conf &&
             echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
             redis-sentinel /etc/sentinel.conf'
    networks:
      kubBackend:
        ipv4_address: 172.21.0.8


  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    networks:
      kubBackend:
        ipv4_address: 172.21.0.9

networks:
  kubBackend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16